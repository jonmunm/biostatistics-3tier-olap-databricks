resources:
  jobs:
    discharges_job:
      name: "Biostatistics Discharges Job"
      performance_target: PERFORMANCE_OPTIMIZED

      tasks:
        # 1. Raw Ingestion (Bronze)
        - task_key: Load_Raw
          spark_python_task:
            python_file: ../src/load_discharges_raw.py
            parameters:
              - "--skip-validation"
              - "false"
          environment_key: default_python_env

        # 2. Data Quality - Raw Validation
        - task_key: DQ_Validation_Raw
          depends_on:
            - task_key: Load_Raw
          spark_python_task:
            python_file: ../tests/test_discharges_raw.py
            parameters:
              - "--input-source"
              # Inject catalog and schema variables defined in your bundle
              - "${var.catalog}.${var.schema}.discharges_raw"
              - "--skip-validation"
              - "false"
          environment_key: default_python_env

        # 3. Silver Transformation
        - task_key: Load_Silver
          depends_on:
            # Now depends on successful raw data quality validation
            - task_key: DQ_Validation_Raw
          spark_python_task:
            python_file: ../src/load_discharges_silver.py
            parameters:
              - "--skip-validation"
              - "false"
          environment_key: default_python_env

        # 4. Data Quality - Silver Validation
        - task_key: DQ_Validation_Silver
          depends_on:
            # Must run after the Silver transformation is complete
            - task_key: Load_Silver
          spark_python_task:
            python_file: ../tests/test_discharges_silver.py
            parameters:
              - "--input-source"
              - "${var.catalog}.${var.schema}.discharges_silver"
              - "--skip-validation"
              - "false"
          environment_key: default_python_env

        # 5. Gold Transformation (Star Schema)
        - task_key: Load_Gold
          depends_on:
            # Now depends on successful silver data quality validation
            - task_key: DQ_Validation_Silver
          spark_python_task:
            python_file: ../src/load_discharges_gold.py
            parameters:
              - "--input-source"
              - "${var.catalog}.${var.schema}.discharges_silver"
              - "--output-source"
              - "${var.catalog}.${var.schema}.discharges_gold"
              - "--skip-validation"
              - "false"
          environment_key: default_python_env

        # 6. Data Quality - Gold Validation (Referential Integrity)
        - task_key: DQ_Validation_Gold
          depends_on:
            - task_key: Load_Gold
          spark_python_task:
            python_file: ../tests/test_discharges_gold.py
            parameters:
              - "--input-source"
              - "${var.catalog}.${var.schema}.discharges_gold"
              - "--skip-validation"
              - "false"
          environment_key: default_python_env

      # Serverless environments definition for Job tasks
      environments:
        - environment_key: default_python_env
          spec:
            client: "1"
            # Add PyPI dependencies required for the Serverless environment
            dependencies:
              - "great_expectations"
