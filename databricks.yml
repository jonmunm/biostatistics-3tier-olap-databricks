bundle:
  name: biostatistics_discharges

include:
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog catalog where tables are stored"
    default: "lab"
  schema:
    description: "Schema within the catalog"
    default: "biostatistics"

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    variables:
      catalog: "lab"
      schema: "biostatistics"
