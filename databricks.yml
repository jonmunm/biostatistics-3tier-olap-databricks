bundle:
  name: biostatistics_discharges

include:
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog catalog where tables are stored"
    default: "lab"
  schema:
    description: "Schema within the catalog"
    default: "biostatistics"
  raw_dlt_table_name:
    description: "Raw DLT table name"
    default: "discharges_raw_dlt"
  silver_dlt_table_name:
    description: "Silver DLT table name"
    default: "discharges_silver_dlt"
  gold_dlt_table_name:
    description: "Gold DLT table name"
    default: "discharges_gold_dlt"
  storage_account:
    description: "Azure Storage Account Name"
    default: "storagesa01"
  storage_container:
    description: "Azure Storage Container Name"
    default: "biostatistics"

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    variables:
      catalog: "lab"
      schema: "biostatistics"
      storage_account: "storagesa01"
      storage_container: "biostatistics"
      raw_dlt_table_name: "discharges_raw_dlt"
      silver_dlt_table_name: "discharges_silver_dlt"
      gold_dlt_table_name: "discharges_gold_dlt"
